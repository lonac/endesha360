# Application Configuration
spring.application.name=system-admin-services
server.port=8083

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/endesha360_admin_db
spring.datasource.username=postgres
spring.datasource.password=Josey@2026
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=mySecretKeyForUserManagementServiceThatShouldBeChangedInProduction
jwt.expiration=86400000

# External Services Configuration
questions.service.url=http://localhost:8086
school.management.service.url=http://localhost:8082
user.management.service.url=http://localhost:8081

# Logging Configuration
logging.level.com.endesha360.SystemAdminServices=DEBUG
logging.level.org.springframework.security=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
